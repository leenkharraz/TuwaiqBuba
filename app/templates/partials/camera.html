{% from "partials/macros.html" import icon %}
<dialog id="camera-dialog" class="sheet camera-sheet" aria-labelledby="camera-title"
        data-txt-use="{{ t('camera.use', n='{n}') }}" data-txt-denied="{{ t('camera.denied') }}"
        data-txt-unavailable="{{ t('camera.unavailable') }}" data-txt-remove="{{ t('camera.remove_shot') }}">
  <div class="sheet-head">
    <h2 id="camera-title">{{ t('camera.title') }}</h2>
    <button type="button" class="icon-btn" data-camera-close aria-label="{{ t('camera.close') }}">{{ icon('x') }}</button>
  </div>
  <p class="small muted">{{ t('camera.tip') }}</p>
  <div class="camera-stage">
    <video id="camera-video" playsinline muted autoplay aria-label="{{ t('camera.title') }}"></video>
    <div class="camera-frame" aria-hidden="true"></div>
    <p class="camera-status" data-camera-status>{{ t('camera.starting') }}</p>
  </div>
  <div class="camera-error notice notice-warn" data-camera-error hidden>
    {{ icon('alert') }}<p data-camera-error-text></p>
  </div>
  <ul class="shots" data-camera-shots aria-live="polite"></ul>
  <div class="camera-actions">
    <button type="button" class="btn btn-primary btn-xl shutter" data-camera-shoot>{{ icon('camera') }}<span>{{ t('camera.shoot') }}</span></button>
    <button type="button" class="btn btn-secondary" data-camera-use disabled>{{ icon('check') }}<span data-camera-use-label>{{ t('camera.use', n=0) }}</span></button>
    <button type="button" class="btn btn-text" data-camera-native>{{ t('camera.native') }}</button>
  </div>
</dialog>
<input type="file" id="native-camera-input" accept="image/*" capture="environment" multiple hidden>
