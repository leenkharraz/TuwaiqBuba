<!doctype html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>{{ t('splash.welcome') }}</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@600;700&family=IBM+Plex+Sans:wght@600&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}?v={{ asset_v }}">
  <link rel="icon" href="{{ url_for('static', path='img/favicon.svg') }}" type="image/svg+xml">
</head>
<body class="page-splash" data-splash-next="/home" data-splash-delay="{{ delay }}">
  <main class="splash" id="main">
    <img class="splash-logo" src="{{ url_for('static', path='img/brand/bupa-logo.png') }}" alt="Bupa Arabia" width="396" height="171">
    <h1 class="splash-text">{{ t('splash.welcome') }}</h1>
    <a class="splash-skip" href="/home">{{ t('splash.continue') }}</a>
  </main>
  <script src="{{ url_for('static', path='js/app.js') }}?v={{ asset_v }}" defer></script>
</body>
</html>
